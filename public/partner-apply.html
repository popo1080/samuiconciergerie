<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Partner — Samui Concierge</title><style>:root{--n:#06191d;--g:#d6ad63;--c:#f7f4ed;--m:#aab4b1}*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--c);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.hero{padding:72px 7vw 55px;background:radial-gradient(circle at 80% 20%,#17383b,#06191d 60%)}.hero h1{font:clamp(44px,7vw,82px)/.95 Georgia,serif;margin:10px 0}.hero i{color:var(--g);font-weight:400}.wrap{max-width:1000px;margin:auto;padding:50px 7vw 90px}.ey{font-size:10px;letter-spacing:.22em;color:var(--g)}form{display:grid;gap:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}label{font-size:10px;letter-spacing:.14em;color:#aebbb7}input,select,textarea{width:100%;padding:14px;background:#07181c;color:#fff;border:1px solid #ffffff25;border-radius:2px;font:inherit}textarea{min-height:110px}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.check{border:1px solid #ffffff1c;padding:12px;display:flex;gap:9px;align-items:center;letter-spacing:0;color:#ddd;font-size:12px}.check input{width:auto}.submit{border:0;background:var(--g);color:#07181c;padding:16px;font-weight:800;letter-spacing:.12em;cursor:pointer}.status{padding:14px;background:#ffffff08;border:1px solid #ffffff15;display:none}.status.show{display:block}.success{color:#bfe8cf}.error{color:#e58e7f}.note{color:#9eaaa7;font-size:12px;line-height:1.6}@media(max-width:650px){.grid,.checks{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:55px 20px}.wrap{padding:40px 20px 70px}}</style></head><body><section class="hero"><div><div class="ey">SAMUI CONCIERGE · PARTNER NETWORK</div><h1>Put your <i>service</i><br>in front of our clients.</h1><p class="note">Apply to join our curated partner network. Your business stays private until Samui Concierge reviews and approves it.</p></div></section><main class="wrap"><form id="apply"><div class="grid"><div class="field"><label>BUSINESS / BRAND NAME *</label><input name="business_name" required></div><div class="field"><label>TELEGRAM *</label><input name="telegram" required placeholder="@yourbusiness"></div><div class="field"><label>CATEGORY *</label><select name="category" required><option value="">Choose…</option><option>Dining</option><option>Sea</option><option>Villas</option><option>Transport</option><option>Wellness</option><option>Experiences</option><option>Beauty</option><option>Family</option><option>Events</option></select></div><div class="field"><label>LOCATION</label><input name="location" value="Koh Samui"></div><div class="field full"><label>SERVICES YOU OFFER * — select all that apply</label><div class="checks"><label class="check"><input type="checkbox" name="services" value="Restaurant Booking"> Restaurant Booking</label><label class="check"><input type="checkbox" name="services" value="Private Chef"> Private Chef</label><label class="check"><input type="checkbox" name="services" value="Private Yacht"> Private Yacht</label><label class="check"><input type="checkbox" name="services" value="Sunset Cruise"> Sunset Cruise</label><label class="check"><input type="checkbox" name="services" value="Snorkeling"> Snorkeling</label><label class="check"><input type="checkbox" name="services" value="Villa Search"> Villa Search</label><label class="check"><input type="checkbox" name="services" value="Airport Transfer"> Airport Transfer</label><label class="check"><input type="checkbox" name="services" value="Private Van"> Private Van</label><label class="check"><input type="checkbox" name="services" value="Scooter Rental"> Scooter Rental</label><label class="check"><input type="checkbox" name="services" value="Villa Massage"> Villa Massage</label><label class="check"><input type="checkbox" name="services" value="Hair Salon"> Hair Salon</label><label class="check"><input type="checkbox" name="services" value="Other Service"> Other Service</label></div></div><div class="field full"><label>PHOTO URLS — up to 8, one per line</label><textarea name="images" placeholder="https://...
https://...
https://..."></textarea></div><div class="field full"><label>ABOUT YOUR BUSINESS / SERVICES</label><textarea name="description" placeholder="Tell us what you offer, where you operate and what makes you special."></textarea></div><div class="field full"><label>ANYTHING WE SHOULD KNOW?</label><textarea name="notes"></textarea></div></div><button class="submit" type="submit">SUBMIT PARTNER APPLICATION →</button><div id="status" class="status" aria-live="polite"></div><div class="note">Your application is private. It will not appear publicly until Samui Concierge approves it.</div></form></main><script>const form=document.querySelector('#apply'),st=document.querySelector('#status');form.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));d.services=[...form.querySelectorAll('input[name="services"]:checked')].map(x=>x.value);d.images=String(d.images||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);if(!d.services.length){st.className='status show error';st.textContent='Please select at least one service.';return}const r=await fetch('/api/partner-applications',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){st.className='status show error';st.textContent=j.error||'Could not submit application.';return}form.reset();st.className='status show success';st.textContent='✓ Application received. Your business is now pending Samui Concierge approval.'});</script></body></html>
